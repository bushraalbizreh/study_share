name: app_study_share
description: "StudyShare - collaborative study groups with verified teachers."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.1

# Versions of the Firebase/BLoC/Dio/etc. packages are the ones already used by
# the project. hive_flutter, google_fonts, bloc_test and mocktail are new and
# were pinned without network access: if `flutter pub get` reports a conflict,
# run `flutter pub upgrade --major-versions`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management, DI, value equality
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  get_it: ^8.2.0

  # Firebase (auth, data, callable backend, push)
  firebase_core: ^4.1.1
  firebase_auth: ^6.1.0
  cloud_firestore: ^6.0.2
  cloud_functions: ^6.0.2
  firebase_messaging: ^16.7.1

  # Local settings (theme, language, onboarding) - Hive
  hive_flutter: ^1.1.0

  # Networking (signed Supabase upload URL only), connectivity
  dio: ^5.9.0
  connectivity_plus: ^7.0.0

  # UI / platform
  image_picker: ^1.2.0
  google_fonts: ^6.3.0
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  flutter_local_notifications: ^22.3.3
  supabase_flutter: ^2.18.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
